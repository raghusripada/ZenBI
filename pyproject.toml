[tool.poetry]
name = "zenbi"
version = "0.1.0"
description = "ZenBI Semantic Layer"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.9"
fastapi = "^0.104.1"
uvicorn = {extras = ["standard"], version = "^0.23.2"}
pydantic = "^2.4.2"
PyYAML = "^6.0.1"
sqlglot = {extras = ["rs"], version = "^18.5.0"}
SQLAlchemy = "~1.4.46"
langchain = "^0.0.339"
openai = "^1.3.7"
openmetadata-ingestion = "^1.1.5"
python-dotenv = "^1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
